spring:
  application:
    name: kitchen-service
  datasource:
    url: ${KITCHEN_DB_URL:jdbc:postgresql://kitchen-postgres:5432/production}
    username: ${KITCHEN_DB_USER:production}
    password: ${KITCHEN_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  transaction:
    default-timeout: ${TRANSACTION_TIMEOUT:5s}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC


---
spring:
  cloud:
    openfeign:
      client:
        config:
          order-service:
            connectTimeout: 1000
            readTimeout: 2000
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
        disable-thread-pool: true
resilience4j:
  circuitbreaker:
    instances:
      order:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        ignoreExceptions:
          - ru.itmo.highload.common.error.ApiException
