name: corporate-catering

x-app: &app
  mem_limit: 512m
  stop_grace_period: 45s
  configs:
    - jvm-network-security
  environment: &environment
    CONFIG_SERVER_URL: http://config-service:8888
    EUREKA_URL: http://discovery-service:8761/eureka/
    CONFIG_BUS_ENABLED: 'true'
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -Djava.security.properties=/jvm-network-security
  healthcheck: &health
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
    interval: 5s
    timeout: 3s
    retries: 48
    start_period: 60s
x-kafka: &kafka
  image: apache/kafka:3.9.1
  mem_limit: 640m
  stop_grace_period: 45s
  configs:
    - jvm-network-security
  environment: &kafka-environment
    JAVA_TOOL_OPTIONS: -Djava.security.properties=/jvm-network-security
    CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    KAFKA_NUM_NETWORK_THREADS: 2
    KAFKA_NUM_IO_THREADS: 2
    KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
  healthcheck:
    test: [CMD-SHELL, "KAFKA_HEAP_OPTS='-Xms32m -Xmx64m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 8s
    retries: 24
    start_period: 30s
services:
  s3-storage:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    mem_limit: 512m
    networks: [s3-local]
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER:?Set local S3 admin user}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:?Set local S3 admin password}
      MINIO_UPDATE: 'off'
    ports:
      - '127.0.0.1:${S3_API_PORT:-19000}:9000'
      - '127.0.0.1:${S3_CONSOLE_PORT:-19001}:9001'
    volumes:
      - s3-data:/data
    healthcheck:
      test: [CMD-SHELL, 'mcli --config-dir /tmp/health alias set local http://localhost:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1 && mcli --config-dir /tmp/health ready local >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  s3-init:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    mem_limit: 128m
    networks: [s3-local]
    entrypoint: [/bin/sh, /init-s3.sh]
    environment:
      S3_ROOT_USER: ${S3_ROOT_USER:?Set local S3 admin user}
      S3_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:?Set local S3 admin password}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set File Service S3 key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set File Service S3 secret}
      S3_BUCKET: ${S3_BUCKET:-order-files}
    volumes:
      - ./infra/s3/init.sh:/init-s3.sh:ro
    depends_on:
      s3-storage:
        condition: service_healthy
  kafka-1:
    <<: *kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data
  kafka-2:
    <<: *kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092
    volumes:
      - kafka-2-data:/var/lib/kafka/data
  kafka-3:
    <<: *kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092
    volumes:
      - kafka-3-data:/var/lib/kafka/data
  kafka-init:
    image: apache/kafka:3.9.1
    mem_limit: 256m
    environment:
      KAFKA_HEAP_OPTS: -Xms64m -Xmx128m
    entrypoint: [/bin/bash, /init-topics.sh]
    volumes:
      - ./infra/kafka/init-topics.sh:/init-topics.sh:ro
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
  config-service:
    mem_limit: 512m
    configs:
      - jvm-network-security
    build:
      context: .
      dockerfile: config-service/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -Djava.security.properties=/jvm-network-security
      CONFIG_REPO_URI: ${CONFIG_REPO_URI:-https://github.com/Vediusse/high_load_configs.git}
      CONFIG_REPO_LABEL: ${CONFIG_REPO_LABEL:-lab4}
      CONFIG_BUS_ENABLED: 'true'
      CONFIG_ADMIN_USER: ${CONFIG_ADMIN_USER:?Set config admin user}
      CONFIG_ADMIN_PASSWORD: ${CONFIG_ADMIN_PASSWORD:?Set config admin password}
    ports:
      - '127.0.0.1:${CONFIG_ADMIN_PORT:-18889}:8889'
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8889/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
  discovery-service:
    <<: *app
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
  order-postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-orders}
      POSTGRES_USER: ${ORDER_DB_USER:-orders}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
  catalog-postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
  catalog-service:
    <<: *app
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    environment:
      <<: *environment
      INTERNAL_JWT_PUBLIC_KEY_BASE64: ${INTERNAL_JWT_PUBLIC_KEY_BASE64:?Set internal JWT public key}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
    depends_on:
      catalog-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
  order-service:
    <<: *app
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      <<: *environment
      INTERNAL_JWT_PUBLIC_KEY_BASE64: ${INTERNAL_JWT_PUBLIC_KEY_BASE64:?Set internal JWT public key}
      ORDER_DB_URL: jdbc:postgresql://order-postgres:5432/${ORDER_DB_NAME:-orders}
      ORDER_DB_USER: ${ORDER_DB_USER:-orders}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
    depends_on:
      order-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
  # Keep the physical database and volume identity for existing data.
  kitchen-postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: production
      POSTGRES_USER: ${KITCHEN_DB_USER:-production}
      POSTGRES_PASSWORD: ${KITCHEN_DB_PASSWORD:?Set KITCHEN_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - production-postgres-data:/var/lib/postgresql/data
  kitchen-service:
    <<: *app
    build:
      context: .
      dockerfile: kitchen-service/Dockerfile
    environment:
      <<: *environment
      INTERNAL_JWT_PUBLIC_KEY_BASE64: ${INTERNAL_JWT_PUBLIC_KEY_BASE64:?Set internal JWT public key}
      KITCHEN_DB_USER: ${KITCHEN_DB_USER:-production}
      KITCHEN_DB_PASSWORD: ${KITCHEN_DB_PASSWORD:?Set KITCHEN_DB_PASSWORD in .env}
    depends_on:
      kitchen-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
  identity-postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: ${IDENTITY_DB_USER:-identity}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - identity-postgres-data:/var/lib/postgresql/data
  identity-service:
    <<: *app
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    environment:
      <<: *environment
      INTERNAL_JWT_PUBLIC_KEY_BASE64: ${INTERNAL_JWT_PUBLIC_KEY_BASE64:?Set internal JWT public key}
      NOTIFICATION_IDENTITY_SECRET: ${NOTIFICATION_IDENTITY_SECRET:?Set Notification Identity credential}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
      INTERNAL_JWT_PRIVATE_KEY_BASE64: ${INTERNAL_JWT_PRIVATE_KEY_BASE64:?Set internal JWT private key}
      GATEWAY_EXCHANGE_SECRET: ${GATEWAY_EXCHANGE_SECRET:?Set Gateway exchange credential}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set JWT_SECRET_BASE64 in .env}
      JWT_ISSUER: ${JWT_ISSUER:-corporate-catering-identity}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_CLOCK_SKEW: ${JWT_CLOCK_SKEW:-30s}
      IDENTITY_BOOTSTRAP_LOGIN: ${IDENTITY_BOOTSTRAP_LOGIN:-}
      IDENTITY_BOOTSTRAP_PASSWORD: ${IDENTITY_BOOTSTRAP_PASSWORD:-}
    depends_on:
      identity-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
  notification-postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-notifications}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set Notification DB password}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
  notification-service:
    <<: *app
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      <<: *environment
      INTERNAL_JWT_PUBLIC_KEY_BASE64: ${INTERNAL_JWT_PUBLIC_KEY_BASE64:?Set internal JWT public key}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:-notifications}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set Notification DB password}
      NOTIFICATION_IDENTITY_SECRET: ${NOTIFICATION_IDENTITY_SECRET:?Set Notification Identity credential}
    depends_on:
      notification-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  file-postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: files
      POSTGRES_USER: ${FILE_DB_USER:-files}
      POSTGRES_PASSWORD: ${FILE_DB_PASSWORD:?Set File DB password}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - file-postgres-data:/var/lib/postgresql/data
  file-service:
    <<: *app
    networks: [default, s3-local]
    build:
      context: .
      dockerfile: file-service/Dockerfile
    environment:
      <<: *environment
      INTERNAL_JWT_PUBLIC_KEY_BASE64: ${INTERNAL_JWT_PUBLIC_KEY_BASE64:?Set internal JWT public key}
      FILE_DB_USER: ${FILE_DB_USER:-files}
      FILE_DB_PASSWORD: ${FILE_DB_PASSWORD:?Set File DB password}
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-10485760}
      FILE_ALLOWED_MIME_TYPES: ${FILE_ALLOWED_MIME_TYPES:-application/pdf,image/png,image/jpeg}
      S3_ENDPOINT: http://s3-storage:9000
      S3_BUCKET: ${S3_BUCKET:-order-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set File Service S3 key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set File Service S3 secret}
      FILE_LEGACY_DIRECTORY: /legacy-files
    volumes:
      - files-data:/legacy-files:ro
    depends_on:
      s3-init:
        condition: service_completed_successfully
      file-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  gateway-service:
    <<: *app
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    environment:
      <<: *environment
      INTERNAL_JWT_PUBLIC_KEY_BASE64: ${INTERNAL_JWT_PUBLIC_KEY_BASE64:?Set internal JWT public key}
      GATEWAY_EXCHANGE_SECRET: ${GATEWAY_EXCHANGE_SECRET:?Set Gateway exchange credential}
    depends_on:
      order-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      kitchen-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
configs:
  jvm-network-security:
    file: ./infra/jvm/network.security
networks:
  s3-local: {}
volumes:
  s3-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  catalog-postgres-data:
  order-postgres-data:
  production-postgres-data:
  identity-postgres-data:
  notification-postgres-data:
  file-postgres-data:
  files-data:
