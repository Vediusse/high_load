spring:
  application:
    name: order-service
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

---
catering:
  blocking:
    enabled: true
    thread-name-prefix: order-blocking

---
catering:
  security:
    internal:
      enabled: true
      public-key-base64: ${INTERNAL_JWT_PUBLIC_KEY_BASE64}
      issuer: corporate-catering-internal
      ttl: 30s
      clock-skew: 2s
