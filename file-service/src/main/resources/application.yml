spring:
  application:
    name: file-service
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
catering:
  blocking:
    enabled: true
    thread-name-prefix: file-blocking
  security:
    internal:
      enabled: true
      public-key-base64: ${INTERNAL_JWT_PUBLIC_KEY_BASE64}

---
spring:
  cloud:
    bus:
      enabled: ${CONFIG_BUS_ENABLED:false}
