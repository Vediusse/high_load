spring:
  application:
    name: identity-service
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
identity:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:corporate-catering-identity}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    clock-skew: ${JWT_CLOCK_SKEW:30s}
  bootstrap:
    login: ${IDENTITY_BOOTSTRAP_LOGIN:}
    password: ${IDENTITY_BOOTSTRAP_PASSWORD:}
catering:
  blocking:
    enabled: true
    thread-name-prefix: identity-blocking

---
catering:
  security:
    internal:
      enabled: true
      public-key-base64: ${INTERNAL_JWT_PUBLIC_KEY_BASE64}
      issuer: corporate-catering-internal
      ttl: 30s
      clock-skew: 2s
identity:
  exchange:
    private-key-base64: ${INTERNAL_JWT_PRIVATE_KEY_BASE64}
    gateway-secret: ${GATEWAY_EXCHANGE_SECRET}
