x-app: &app
  mem_limit: 512m
  stop_grace_period: 45s
  environment: &environment
    CONFIG_SERVER_URL: http://config-service:8888
    EUREKA_URL: http://discovery-service:8761/eureka/
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
  healthcheck: &health
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 20s
services:
  config-service:
    mem_limit: 512m
    build:
      context: .
      dockerfile: config-service/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
  discovery-service:
    <<: *app
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
  order-postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-orders}
      POSTGRES_USER: ${ORDER_DB_USER:-orders}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-orders-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
  catalog-postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
  catalog-service:
    <<: *app
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    environment:
      <<: *environment
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog-dev}
    depends_on:
      catalog-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
  order-service:
    <<: *app
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      <<: *environment
      DB_URL: jdbc:postgresql://order-postgres:5432/${ORDER_DB_NAME:-orders}
      DB_USER: ${ORDER_DB_USER:-orders}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-orders-dev}
    depends_on:
      order-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
  # Keep the physical database and volume identity for existing data.
  kitchen-postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: production
      POSTGRES_USER: ${KITCHEN_DB_USER:-${PRODUCTION_DB_USER:-production}}
      POSTGRES_PASSWORD: ${KITCHEN_DB_PASSWORD:-${PRODUCTION_DB_PASSWORD:-production-dev}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - production-postgres-data:/var/lib/postgresql/data
  kitchen-service:
    <<: *app
    build:
      context: .
      dockerfile: kitchen-service/Dockerfile
    environment:
      <<: *environment
      KITCHEN_DB_USER: ${KITCHEN_DB_USER:-${PRODUCTION_DB_USER:-production}}
      KITCHEN_DB_PASSWORD: ${KITCHEN_DB_PASSWORD:-${PRODUCTION_DB_PASSWORD:-production-dev}}
    depends_on:
      kitchen-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
  gateway-service:
    <<: *app
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    depends_on:
      order-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      kitchen-service:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
volumes:
  catalog-postgres-data:
  order-postgres-data:
  production-postgres-data:
