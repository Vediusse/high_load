x-app: &app
  mem_limit: 512m
  environment: &environment
    CONFIG_SERVER_URL: http://config-service:8888
    EUREKA_URL: http://discovery-service:8761/eureka/
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
  healthcheck: &health
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 20s
services:
  config-service:
    mem_limit: 512m
    build:
      context: .
      dockerfile: config-service/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
  discovery-service:
    <<: *app
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catering}
      POSTGRES_USER: ${POSTGRES_USER:-catering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catering-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - catering-postgres-data:/var/lib/postgresql/data
  catalog-postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
  catalog-service:
    <<: *app
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    environment:
      <<: *environment
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog-dev}
    depends_on:
      catalog-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
  monolith:
    <<: *app
    build:
      context: .
      dockerfile: monolith/Dockerfile
    environment:
      <<: *environment
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-catering}
      DB_USER: ${POSTGRES_USER:-catering}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-catering-dev}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
  gateway-service:
    <<: *app
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    depends_on:
      monolith:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
volumes:
  catalog-postgres-data:
  catering-postgres-data:
