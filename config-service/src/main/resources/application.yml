server:
  port: 8888
spring:
  application:
    name: config-service
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_REPO_URI:https://github.com/Vediusse/high_load_configs.git}
          default-label: ${CONFIG_REPO_LABEL:main}
          try-master-branch: false
          search-paths: '{application}'
          clone-on-start: true
          timeout: 10
management:
  endpoint:
    health:
      probes:
        enabled: true
