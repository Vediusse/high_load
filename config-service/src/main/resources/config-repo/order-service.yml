spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://order-postgres:5432/orders}
    username: ${ORDER_DB_USER:orders}
    password: ${ORDER_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  transaction:
    default-timeout: ${TRANSACTION_TIMEOUT:5s}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Заказы и организации
        url: /v3/api-docs
      - name: Кухня
        url: /v3/api-docs/kitchen
      - name: Каталог
        url: /v3/api-docs/catalog

---
spring:
  cloud:
    openfeign:
      client:
        config:
          catalog-service:
            connectTimeout: 1000
            readTimeout: 2000
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
        disable-thread-pool: true
resilience4j:
  circuitbreaker:
    instances:
      catalog:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        ignoreExceptions:
          - ru.itmo.highload.common.error.ApiException
