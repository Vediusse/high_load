spring:
  application:
    name: gateway-service
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

# GatewayErrors handles routing and upstream failures.
catering:
  web:
    errors:
      enabled: false

---
catering:
  security:
    internal:
      enabled: true
      public-key-base64: ${INTERNAL_JWT_PUBLIC_KEY_BASE64}
      issuer: corporate-catering-internal
      ttl: 30s
      clock-skew: 2s
identity:
  exchange:
    gateway-secret: ${GATEWAY_EXCHANGE_SECRET}
