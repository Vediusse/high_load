spring:
  cloud:
    config:
      enabled: false
  application:
    name: corporate-catering
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catering}
    username: ${DB_USER:catering}
    password: ${DB_PASSWORD:catering-dev}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

eureka:
  client:
    enabled: false

---
spring:
  cloud:
    openfeign:
      client:
        config:
          order-service:
            connectTimeout: 1000
            readTimeout: 2000
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
        disable-thread-pool: true
resilience4j:
  circuitbreaker:
    instances:
      order:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        ignoreExceptions:
          - ru.itmo.highload.common.error.ApiException

---
catering:
  blocking:
    enabled: true
    thread-name-prefix: kitchen-blocking
