spring:
  application:
    name: monolith
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catering}
    username: ${DB_USER:catering}
    password: ${DB_PASSWORD:catering-dev}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC


springdoc:
  swagger-ui:
    path: /swagger-ui.html
